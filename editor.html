<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Story Editor</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="toolbar">
    <!-- Buttons injected by JS -->
</div>
<input type="file" id="importFile" accept=".json" style="display:none;">

<div id="editor">
    <div id="graph"></div>
    <div id="properties">
        <h2>Select a scene</h2>
        <p>Click any node to edit.</p>
    </div>
</div>

<!-- Only the core Cytoscape library -->
<script src="https://unpkg.com/cytoscape/dist/cytoscape.min.js"></script>
<!-- Version bump to force browser reload -->
<script src="editor.js?v=3"></script>

</body>
</html>
